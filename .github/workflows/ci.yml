name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    # `dev` is here because it is the integration branch: day-to-day work and the
    # improvement agent's PRs both target it, and CI that only watched `main` would let
    # every one of them through ungated.
    branches: [main, dev]

jobs:
  unit:
    name: Unit & component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npx prisma generate
      - run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install
      # Gate on PRODUCTION deps at HIGH severity+. Moderate/dev advisories don't block
      # CI (they're tracked + PR'd by Dependabot); a new high/critical in a shipped dep
      # fails the build. See issue #22.
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    # Requires the preview deployment URL passed in from a Vercel deploy hook or workflow
    if: vars.E2E_BASE_URL != ''
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          # Point at the Vercel preview URL for this PR (isolated test DB, not production)
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
