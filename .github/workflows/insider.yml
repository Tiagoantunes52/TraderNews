name: Insider Pipeline

# Separate from the main news pipeline: Form 4 filings land daily (not intraday),
# so insider data only needs a once-or-twice-daily refresh on its own schedule.
on:
  schedule:
    - cron: "30 11 * * *"  # daily, 11:30 UTC (after US market open settles)
  workflow_dispatch:        # manual trigger from the Actions UI

concurrency:
  group: insider-pipeline
  cancel-in-progress: false

# Least privilege: this job never touches the repository or the GitHub API — it only
# POSTs to $APP_URL with the pipeline secret. An empty map grants the GITHUB_TOKEN no
# scopes at all, so a compromised step here has nothing to spend. The repo-level default
# is already `read`, but that is a setting someone can change; this is a property of the
# workflow.
permissions: {}

jobs:
  run-insider:
    runs-on: ubuntu-latest
    environment: Production
    env:
      APP_URL: ${{ secrets.APP_URL }}
      PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
      MAX_POLLS: "30"
      POLL_DELAY: "5"
      # Correlation id: ties the insider stage's structured logs (Axiom) to one run.
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check secrets are set
        run: |
          if [ -z "$APP_URL" ]; then echo "ERROR: APP_URL secret is empty" && exit 1; fi
          if [ -z "$PIPELINE_SECRET" ]; then echo "ERROR: PIPELINE_SECRET secret is empty" && exit 1; fi
          echo "APP_URL is set (length: ${#APP_URL})"

      # The insider stage is budget-bounded + resumable: it returns {"done": ...},
      # processing a slice of US-equity tickers per call. Poll until done.
      - name: Run insider stage
        run: |
          i=0
          while [ "$i" -lt "$MAX_POLLS" ]; do
            i=$((i + 1))
            resp=$(curl -fsS -X POST "$APP_URL/api/pipeline/insider" \
              -H "x-pipeline-secret: $PIPELINE_SECRET" \
              -H "x-pipeline-run-id: $RUN_ID") || {
                echo "insider: HTTP call failed (poll $i)"; exit 1; }
            echo "poll $i: $resp"
            done=$(printf '%s' "$resp" | jq -r '.done // empty')
            if [ "$done" = "true" ]; then
              echo "insider stage complete after $i poll(s)"
              exit 0
            fi
            sleep "$POLL_DELAY"
          done
          echo "insider stage did not finish within $MAX_POLLS polls"
          exit 1

      # Congress (STOCK Act) disclosures share this daily cadence — the 45-day
      # disclosure lag means more-frequent runs would gain nothing — and reuse the
      # same secrets, concurrency group and run id. The stage returns {"done": true}
      # immediately, so the poll loop exits on the first iteration. Note: if the
      # insider step above fails, this step is skipped (steps are sequential and we
      # don't set `if: always()`); that's acceptable — both retry on the next run.
      - name: Run congress stage
        run: |
          i=0
          while [ "$i" -lt "$MAX_POLLS" ]; do
            i=$((i + 1))
            resp=$(curl -fsS -X POST "$APP_URL/api/pipeline/congress" \
              -H "x-pipeline-secret: $PIPELINE_SECRET" \
              -H "x-pipeline-run-id: $RUN_ID") || {
                echo "congress: HTTP call failed (poll $i)"; exit 1; }
            echo "poll $i: $resp"
            done=$(printf '%s' "$resp" | jq -r '.done // empty')
            if [ "$done" = "true" ]; then
              echo "congress stage complete after $i poll(s)"
              exit 0
            fi
            sleep "$POLL_DELAY"
          done
          echo "congress stage did not finish within $MAX_POLLS polls"
          exit 1

      # Private-company news watch (issue #63) shares this daily cadence too:
      # Google News RSS moves slowly enough that once a day is plenty, and the
      # stage is idempotent (URL-deduped inserts), so reruns are free. Runs with
      # `if: always()` because it shares nothing with the two steps above — an
      # insider/congress API failure shouldn't starve the news radar.
      - name: Run private-companies stage
        if: always()
        run: |
          i=0
          while [ "$i" -lt "$MAX_POLLS" ]; do
            i=$((i + 1))
            resp=$(curl -fsS -X POST "$APP_URL/api/pipeline/private-companies" \
              -H "x-pipeline-secret: $PIPELINE_SECRET" \
              -H "x-pipeline-run-id: $RUN_ID") || {
                echo "private-companies: HTTP call failed (poll $i)"; exit 1; }
            echo "poll $i: $resp"
            done=$(printf '%s' "$resp" | jq -r '.done // empty')
            if [ "$done" = "true" ]; then
              echo "private-companies stage complete after $i poll(s)"
              exit 0
            fi
            sleep "$POLL_DELAY"
          done
          echo "private-companies stage did not finish within $MAX_POLLS polls"
          exit 1
