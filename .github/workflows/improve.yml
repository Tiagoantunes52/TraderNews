name: Improvement Agent

# Closes the observe → interpret → ACT loop: after the daily post-close review lands,
# read the latest findings, pick ONE code-addressable finding not already handled, and
# run the Claude Code Action to implement a minimal fix and open a PR. CI gates the PR;
# a human reviews and merges into `dev`, then promotes `dev` to `main` separately —
# nothing here reaches either branch on its own.
#
# Trigger: once per trading day, after the review window (the review's pg_cron tick
# produces the report ~1h after the close, and the interpret step posts to Slack right
# after). GH cron drift is low-impact — a skipped run just defers a fix; findings persist.
on:
  schedule:
    - cron: "30 23 * * 1-5"   # after the review lands + the interpret post
  workflow_dispatch:           # manual trigger for rollout / testing

concurrency:
  group: improve-agent
  cancel-in-progress: false

permissions:
  contents: write        # the action commits the fix to a branch
  pull-requests: write   # …and opens the PR
  issues: write          # …and the workflow files a marker issue when the agent declines
  id-token: write        # OIDC exchange for the Claude GitHub App token (required for the
                         # default GitHub auth — see anthropics/claude-code-action FAQ)

jobs:
  improve:
    runs-on: ubuntu-latest
    environment: Production
    # Kill-switch: the schedule only runs when the repo variable is explicitly enabled,
    # but manual dispatch always runs so PRs can be reviewed during rollout with the
    # schedule still off.
    if: github.event_name == 'workflow_dispatch' || vars.IMPROVE_AGENT_ENABLED == 'true'
    env:
      APP_URL: ${{ secrets.APP_URL }}
      PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
    steps:
      # `dev` explicitly, not the default branch. The agent branches from whatever is
      # checked out, so checking out `main` would have it diff against a tree that is
      # behind — re-fixing work already merged into `dev` and opening PRs that conflict.
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check secrets are set
        run: |
          if [ -z "$APP_URL" ]; then echo "ERROR: APP_URL secret is empty" && exit 1; fi
          if [ -z "$PIPELINE_SECRET" ]; then echo "ERROR: PIPELINE_SECRET secret is empty" && exit 1; fi

      # tsx (to run the selector) + the deps the agent needs to run npm test / tsc.
      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Fetch latest daily review
        run: |
          curl -fsS "$APP_URL/api/reports/daily-review" \
            -H "x-pipeline-secret: $PIPELINE_SECRET" -o report.json
          echo "status=$(jq -r '.status' report.json), findings=$(jq -r '.findings | length' report.json)"

      # Codes already covered by an open auto-improve PR, or one closed within 14 days —
      # so we neither duplicate in-flight work nor immediately re-PR a just-merged/closed fix.
      #
      # Declines count too. A finding the agent looks at and refuses produces NO PR, so a
      # PR-only view of "handled" learns nothing and re-picks the same code tomorrow: that
      # is how SIGNAL_INVERTED was chosen on 13 consecutive runs, each one paying for the
      # same reasoned refusal. The "Record a declined finding" step below writes an issue
      # for those, and they expire on the same 14-day clock.
      #
      # The DEFAULT token is fine here — this only READS PRs and issues. It is deliberately
      # NOT set job-wide: if it leaked into the agent's shell, a PR opened by `gh` under the
      # github-actions identity would not trigger CI (GitHub blocks that identity from
      # starting workflows). The agent instead opens its PR via the Claude GitHub App
      # token, which does trigger CI.
      - name: Collect already-handled finding codes
        id: handled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --label auto-improve --state all --json title,state,closedAt --limit 100 > prs.json
          gh issue list --label auto-improve-declined --state all --json title,state,closedAt --limit 100 > declined.json
          # -s slurps both files into one array of arrays; `add` concatenates them. Titles
          # are "auto-improve: CODE" and "auto-improve declined: CODE", so one sub() strips
          # either prefix.
          codes=$(jq -rs 'add
            | [ .[]
                | select(.state == "OPEN" or (.closedAt != null and ((now - (.closedAt | fromdate)) < 1209600)))
                | .title | sub("^auto-improve( declined)?: "; "") ]
            | unique | join(",")' prs.json declined.json)
          echo "codes=$codes" >> "$GITHUB_OUTPUT"
          echo "already handled: ${codes:-<none>}"

      # `codes` reaches the CLI through the environment rather than a `${{ }}` expression
      # spliced into `run:`. Those are substituted BEFORE the shell parses the line, and
      # the values are derived from PR/issue TITLES — so a title containing shell
      # metacharacters would execute here rather than being passed as an argument.
      # Applying the `auto-improve` label takes write access, so nothing untrusted can
      # reach this today; that is a permission setting, though, not a property of the
      # code, and it is a thin thing to rest on once anyone can open the PR being
      # labelled. Quoted "$HANDLED" is one argument whatever it contains.
      - name: Pick one finding
        id: pick
        env:
          HANDLED: ${{ steps.handled.outputs.codes }}
        run: |
          npx tsx scripts/pick-finding.ts --report report.json --handled "$HANDLED" > finding.txt
          if [ "$(cat finding.txt)" = "none" ]; then
            echo "has_finding=false" >> "$GITHUB_OUTPUT"
            echo "No actionable finding this run — nothing to do."
          else
            echo "has_finding=true" >> "$GITHUB_OUTPUT"
            echo "Picked: $(cat finding.txt)"
          fi

      # Combine the standing instructions with the chosen finding into one prompt.
      - name: Build agent prompt
        id: prompt
        if: steps.pick.outputs.has_finding == 'true'
        run: |
          {
            echo "prompt<<PROMPT_EOF"
            cat .github/agent/improve-prompt.md
            echo ""
            echo "FINDING:"
            cat finding.txt
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      # The agentic coding loop: reads the repo, diagnoses, edits, runs tests, opens the PR.
      #
      #  - MODEL auth: the user's Claude subscription via CLAUDE_CODE_OAUTH_TOKEN
      #    (ANTHROPIC_API_KEY is a drop-in fallback). This is unrelated to GitHub auth.
      #  - GITHUB auth: intentionally NO `github_token` — the action mints a Claude
      #    GitHub App token via OIDC (hence `id-token: write` above). PRs opened by the
      #    App trigger CI; PRs opened by the default GITHUB_TOKEN would NOT.
      #  - TOOLS: Claude gets no Bash by default (only Edit/Read/Write). The agent needs
      #    Bash to run `npm test`/`tsc`, git, and `gh pr create`, so grant it here.
      #    `--max-turns` bounds the loop (and the cost) per run. 40 proved too tight:
      #    the first live run (30212464048) diagnosed the finding, wrote the fix and
      #    pushed the branch, then exhausted its turns before `gh pr create` — leaving
      #    a branch with no PR. Diagnose→edit→`npm test`→`tsc`→commit→PR costs turns,
      #    and each red test iteration costs several more.
      - name: Run improvement agent
        if: steps.pick.outputs.has_finding == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools Edit,Read,Write,Bash
            --max-turns 80

      # Without this the turn-by-turn record dies with the runner, and a failed run
      # (max-turns, a tool error, a bad edit loop) can't be diagnosed after the fact.
      # `always()` so it survives the failure that makes it worth reading.
      - name: Upload agent execution log
        if: always() && steps.pick.outputs.has_finding == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: claude-execution-output
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 30

      # Close the feedback loop on a NON-result. The selector only knows what PRs exist, so
      # a finding the agent examines and refuses is invisible to it and gets picked again
      # tomorrow, and every day after — SIGNAL_INVERTED ran that loop 13 times, each run
      # paying for the same well-reasoned "no PR: this is a strategy fact, not a bug".
      # Writing the refusal down as an issue makes it a fact the selector can read.
      #
      # A decline is a JUDGEMENT, not a failure, and only a clean finish counts as one:
      # `subtype == "success"` with no PR. An agent cut off by --max-turns (subtype
      # `error_max_turns`) or killed by a tool error has NOT judged anything and must be
      # free to retry tomorrow, so those record nothing.
      #
      # The issue suppresses the code while it is OPEN and for 14 days after it is closed.
      # Open-ended suppression is the point: it holds until a human triages the refusal —
      # by fixing the finding's source, by adding the code to NON_CODE_CODES (the right
      # answer when the agent is refusing on principle rather than on difficulty), or by
      # just closing the issue to let the agent have another go two weeks later.
      - name: Record a declined finding
        if: always() && steps.pick.outputs.has_finding == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LOG: ${{ runner.temp }}/claude-execution-output.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          code=$(jq -r '.code' finding.txt)

          # A PR means the agent acted — nothing to record. Matched on TITLE across all open
          # PRs rather than by label or `--search`: the agent labels its PR in a separate
          # step that is allowed to fail (see improve-prompt.md), so a label filter would
          # miss a real PR and record a decline over the top of finished work. `--search`
          # is avoided because "auto-improve: CODE" reads as a qualifier to GitHub search.
          if gh pr list --state open --limit 100 --json title \
               | jq -e --arg t "auto-improve: $code" 'any(.[]; .title == $t)' > /dev/null; then
            echo "PR open for $code — the agent acted, not a decline."
            exit 0
          fi

          if [ ! -f "$LOG" ]; then
            echo "no execution log — cannot tell a decline from a crash; recording nothing."
            exit 0
          fi
          result=$(jq -r '[.[] | select(.type == "result")] | last' "$LOG")
          subtype=$(jq -r '.subtype // "missing"' <<< "$result")
          if [ "$subtype" != "success" ]; then
            echo "agent did not finish cleanly (result=$subtype) — retryable, recording nothing."
            exit 0
          fi

          # One open marker per code. Matched on title for the same reason as the PR check —
          # an existing marker whose labelling failed must be found and REPAIRED, not
          # duplicated daily while never suppressing anything. --add-label is idempotent.
          existing=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "auto-improve declined: $code" 'map(select(.title == $t)) | .[0].number // ""')
          if [ -n "$existing" ]; then
            echo "open decline marker already exists for $code (#$existing)."
            gh issue edit "$existing" --add-label auto-improve-declined > /dev/null \
              || echo "::warning::could not label issue #$existing — $code will be re-picked tomorrow"
            exit 0
          fi

          # Created here rather than assumed: `gh issue create --label` fails outright on a
          # missing label, which would throw away the record entirely. Same trap the agent
          # prompt warns about for PRs — so create the label, then the issue, then attach.
          gh label create auto-improve-declined \
            --color BFD4F2 \
            --description "Improvement agent examined this finding and opened no PR" \
            2>/dev/null || true

          {
            echo "The improvement agent examined this finding and chose not to open a PR."
            echo
            echo "It is suppressed from selection while this issue is open, and for 14 days"
            echo "after it closes. If the refusal is on principle — a strategy or operational"
            echo "fact rather than a code bug — add \`$code\` to \`NON_CODE_CODES\` in"
            echo "\`src/lib/pick-finding.ts\` so no future run pays to rediscover it."
            echo
            echo "Run: $RUN_URL"
            echo
            echo "## Finding"
            echo
            echo '```json'
            jq . finding.txt
            echo '```'
            echo
            echo "## The agent's reasoning"
            echo
            jq -r '.result // "(no final message recorded)"' <<< "$result"
          } > decline.md

          n=$(gh issue create --title "auto-improve declined: $code" --body-file decline.md \
              | tail -1 | grep -oE '[0-9]+$')
          echo "recorded decline for $code as issue #$n"
          # The label is what the selector reads, so a failure here matters: say so loudly
          # rather than leaving a silently-uncounted issue, but don't fail the run over it.
          gh issue edit "$n" --add-label auto-improve-declined \
            || echo "::warning::could not label issue #$n — $code will be re-picked tomorrow"

      # Optional end-to-end visibility. SLACK_WEBHOOK_URL is an app-server env var today,
      # NOT a GitHub Actions secret — add it to the Production environment to enable this;
      # otherwise the step self-skips.
      - name: Notify Slack
        if: steps.pick.outputs.has_finding == 'true' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          code=$(jq -r '.code' finding.txt)
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"🤖 Improvement agent ran for finding \`${code}\` — check open PRs labelled auto-improve.\"}" || true
